name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / source audit / package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: ruff check qgis_ai_copilot tests scripts
      - run: python scripts/check_public_release.py
      - run: python scripts/build_plugin.py

  qgis:
    name: QGIS 3.44.6 native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: qgis/qgis@sha256:77e60f2a9ec8a1f61c920bfc3b0cec8f7cfe1c0a784ff0be03073f9103a415d1 # 3.44.6-noble
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
      PYTHONPATH: /usr/share/qgis/python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Install local PDF renderer
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils
      - run: /usr/bin/python3 scripts/run_qgis_tests.py
